<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Smart Study Buddy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .auth-container {
            max-width: 480px;
            margin: 50px auto;
            padding: 20px;
        }
        .auth-card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        .hint {
            font-size: 0.8rem;
            color: #6b7280;
            margin-top: 4px;
        }
        .auth-btn {
            width: 100%;
            background: #4f46e5;
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .auth-btn:hover {
            background: #4338ca;
        }
        .auth-footer {
            margin-top: 24px;
            text-align: center;
            color: #6b7280;
            font-size: 0.95rem;
        }
        .auth-footer a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        .alert-error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #f87171;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="{{ url_for('index') }}">📚 Smart Study Buddy</a>
        <div class="nav-links">
            <a href="{{ url_for('login') }}">🔑 Login</a>
            <a class="active" href="{{ url_for('register') }}">📝 Register</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <h2 style="margin-top: 0; color: #1e293b; text-align: center;">Create Account</h2>
            <p style="text-align: center; color: #64748b; margin-bottom: 28px;">Start tracking your study progress with your own personal dashboard</p>

            {% if error %}
                <div class="alert-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('register') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autofocus autocomplete="username" value="{{ request.form.get('username', '') }}" maxlength="50">
                    <div class="hint">3–50 characters (letters, numbers, hyphens, underscores).</div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password" minlength="8" maxlength="128">
                    <div class="hint">At least 8 characters.</div>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password" minlength="8" maxlength="128">
                </div>

                <button type="submit" class="auth-btn">Create Account</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="{{ url_for('login') }}">Sign In</a>
            </div>
        </div>
    </div>
</body>
</html>
