<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Smart Study Buddy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .auth-container {
            max-width: 480px;
            margin: 50px auto;
            padding: 20px;
        }
        .auth-card {
            background: #FFFFFF;
            padding: 40px 36px;
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-main);
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 1rem;
            box-sizing: border-box;
            transition: all var(--transition-fast);
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-lavender);
            box-shadow: 0 0 0 3px rgba(139, 123, 232, 0.18);
        }
        .hint {
            font-size: 12.5px;
            color: var(--text-secondary);
            margin-top: 5px;
        }
        .auth-btn {
            width: 100%;
            background: var(--primary-lavender);
            color: #FFFFFF;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-normal);
            margin-top: 10px;
            box-shadow: 0 4px 14px rgba(139, 123, 232, 0.28);
        }
        .auth-btn:hover {
            background: var(--hover-lavender);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(117, 101, 216, 0.38);
        }
        .auth-footer {
            margin-top: 26px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }
        .auth-footer a {
            color: var(--primary-lavender);
            text-decoration: none;
            font-weight: 700;
        }
        .auth-footer a:hover {
            text-decoration: underline;
            color: var(--hover-lavender);
        }
        .alert-error {
            background: #FEF2F2;
            color: #991B1B;
            border: 1px solid #FECACA;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="{{ url_for('index') }}">📚 Smart Study Buddy</a>
        <div class="nav-links">
            <a href="{{ url_for('login') }}">🔑 Login</a>
            <a class="active" href="{{ url_for('register') }}">📝 Register</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <h2 style="margin-top: 0; color: var(--text-main); text-align: center; font-size: 26px;">Create Your Account ✨</h2>
            <p style="text-align: center; color: var(--text-secondary); margin-bottom: 28px; font-size: 14.5px;">Start planning and tracking your study journey with your personal dashboard</p>

            {% if error %}
                <div class="alert-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('register') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autofocus autocomplete="username" value="{{ request.form.get('username', '') }}" maxlength="50" placeholder="Choose a username">
                    <div class="hint">3–50 characters (letters, numbers, hyphens, underscores).</div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password" minlength="8" maxlength="128" placeholder="Create a strong password">
                    <div class="hint">At least 8 characters.</div>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password" minlength="8" maxlength="128" placeholder="Re-enter your password">
                </div>

                <button type="submit" class="auth-btn">Create Free Account</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="{{ url_for('login') }}">Sign In</a>
            </div>
        </div>
    </div>
</body>
</html>
