
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Study Plan | Smart Study Buddy</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fc;
            color: #1f2937;
        }

        .navbar {
            background: #4338ca;
            color: white;
            padding: 18px 8%;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            max-width: 720px;
            margin: 55px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #4338ca;
            margin-top: 0;
        }

        .description {
            color: #6b7280;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #a5b4fc;
            border-color: #6366f1;
        }

        .button {
            display: inline-block;
            border: none;
            border-radius: 8px;
            padding: 13px 20px;
            margin-top: 25px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
        }

        .primary {
            background: #4338ca;
            color: white;
            width: 100%;
        }

        .primary:hover {
            background: #3730a3;
        }

        .back {
            color: #4338ca;
            margin-top: 20px;
            display: inline-block;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="navbar">📚 Smart Study Buddy</div>

    <div class="container">
        <div class="card">
            <h1>Create Study Plan ✨</h1>

            <p class="description">
                Plan your study sessions, manage your time, and
                stay consistent with your learning goals.
            </p>

            <form action="{{ url_for('add_plan') }}" method="POST">
                <label for="subject">Subject</label>
                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="e.g. Python, DBMS, DSA"
                    required
                >

                <label for="days">Number of Days</label>
                <input
                    type="number"
                    id="days"
                    name="days"
                    min="1"
                    placeholder="e.g. 7"
                    required
                >

                <label for="daily_hours">Daily Study Hours</label>
                <input
                    type="number"
                    id="daily_hours"
                    name="daily_hours"
                    min="0.5"
                    step="0.5"
                    placeholder="e.g. 2"
                    required
                >

                <button type="submit" class="button primary">
                    Save Study Plan
                </button>
            </form>

            <a href="{{ url_for('plans') }}" class="back">
                ← Back to Study Plans
            </a>
        </div>
    </div>
</body>
</html>
